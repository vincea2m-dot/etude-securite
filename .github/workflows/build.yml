name: Compiler l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Vérifier le SDK Android (préinstallé sur ubuntu-24.04)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Conserver l'APK
        uses: actions/upload-artifact@v5
        with:
          name: EtudeSecurite-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publier la dernière version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk EtudeSecurite.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest EtudeSecurite.apk \
            --title "Étude Sécurité – dernière version" \
            --notes "APK compilé automatiquement le $(date '+%d/%m/%Y %H:%M'). Téléchargez EtudeSecurite.apk sur le téléphone pour l'installer."
