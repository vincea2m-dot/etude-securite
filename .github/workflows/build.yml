name: Compiler l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Conserver l'APK
        uses: actions/upload-artifact@v4
        with:
          name: EtudeSecurite-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publier la dernière version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk EtudeSecurite.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest EtudeSecurite.apk \
            --title "Étude Sécurité – dernière version" \
            --notes "APK compilé automatiquement le $(date '+%d/%m/%Y %H:%M'). Téléchargez EtudeSecurite.apk sur le téléphone pour l'installer."
